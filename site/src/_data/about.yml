education: 8TPS is dedicated to generating radically inclusive and accessible spaces for performers and audiences. In addition to offering a trans-literate, gender-liberated creative environment, this production model centers disabled and neurodivergent voices with the aim of removing barriers to artistic expression and fostering a sense of belonging.
