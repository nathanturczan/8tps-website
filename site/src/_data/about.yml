lede: 8TPS is a radical vocal collective of trans, nonbinary, and gender-expansive musicians. Known for their playful interpretations, powerful reflections, and polystylistic surprises, this company of genre-fluid performers and educators centers community, artistry, joy, and trans excellence. Working across contemporary a cappella, experimental music, and a variety of folk spaces, 8TPS collaborates with trans and queer artists of all kinds through multiple musical modalities. Past partners include Mariachi Arco•Iris, Tonality, Celebration Theater, The Colony Theatre, Grand Performances, WeHo Pride, and more.
story: |-
  Spearheaded by co-founders Socks Whitmore and Tanner Pfeiffer, 8TPS is dedicated to generating radically inclusive and accessible spaces for both performers and audiences. Working across contemporary a cappella, experimental classical, and a variety of folk spaces, 8TPS collaborates with trans and queer artists of all kinds through multiple musical modalities.

  As part of a commitment to expanding the canon of trans-composed works, 8TPS commissions new arrangements and compositions from trans artists. These works can be seen in the music video project Never Change as well as Inventing/Inviting: Trans Songs of Change, a concert of works exclusively by trans artists.

  “A groundbreaking and truly essential part of the Los Angeles music scene” (BroadwayWorld), 8TPS creates in community with musicians across lived experiences, artistic backgrounds, and musical styles.
