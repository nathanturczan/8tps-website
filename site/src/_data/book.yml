lede: Interested in booking 8TPS for your next event? Searching for the right set of TGE musicians for a project? In need of multidisciplinary educators for your next workshop or teaching artist engagement? Let us know here!
intro: Working across pop a cappella, contemporary classical, and folk spaces, 8TPS collaborates with trans artists of all kinds through multiple musical modalities. Individual 8TPS members are experts in mariachi, shapenote, opera, jazz, musical theater, and more. Through these varied musical practices, 8TPS connects commercial, traditional, and experimental forms of music making.
